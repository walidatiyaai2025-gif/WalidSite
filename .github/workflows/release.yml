name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable SemVer candidate version (e.g. 1.2.3); never implies production acceptance'
        required: true
        type: string
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require exact current main SHA with successful CI, installer and Android QA builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TESTED_SHA"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${TESTED_SHA}/check-runs?per_page=100" \
            | jq -e '(.check_runs | any(.name == "required-ci-gate" and .status == "completed" and .conclusion == "success")) and (.check_runs | any(.name == "build-cpanel-package" and .status == "completed" and .conclusion == "success")) and (.check_runs | any(.name == "build-android-qa-apk" and .status == "completed" and .conclusion == "success"))' >/dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_mysql, zip, sodium
      - name: Install trusted production dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Produce versioned Setup and Update inspection candidates
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/candidates
          python3 qa/build_cpanel_package.py \
            --source . --output dist/WalidSite-cPanel.zip --sha "$SOURCE_SHA"
          (cd dist && sha256sum --check WalidSite-cPanel.zip.sha256)
          PYTHONPATH="$PWD" python3 qa/prepare_release_candidate.py \
            --cpanel-zip dist/WalidSite-cPanel.zip \
            --output-dir dist/candidates \
            --version "$CANDIDATE_VERSION" --sha "$SOURCE_SHA" \
            > dist/candidate-build-receipt.json
          (cd dist/candidates && sha256sum --check ./*.sha256)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/candidate-build-receipt.json').read_text())
          assert data['candidate_prepared'] is True
          assert data['source_sha'] == os.environ['SOURCE_SHA']
          assert data['production_ready'] is False
          assert data['published'] is False
          assert data['publisher_signature_verified'] is False
          assert all(value is False for value in data['acceptance'].values())
          assert not (Path('dist/candidates') / 'latest.json').exists()
          PY
      - name: Verify real Update ZIP with PHP Ed25519 and archive safety boundary
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          php qa/cpanel_signed_update_artifact_probe.php \
            dist/candidates "${CANDIDATE_VERSION}" "${SOURCE_SHA}" \
            > dist/candidates/signed-zip-acceptance.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('dist/candidates')
          version, sha = os.environ['CANDIDATE_VERSION'], os.environ['SOURCE_SHA']
          manifest = json.loads((directory / f'WalidSite-Release-Manifest-v{version}.json').read_text())
          proof = json.loads((directory / 'signed-zip-acceptance.json').read_text())
          assert proof['schema'] == 'walidsite.signed-zip-ci-acceptance.v1'
          assert proof['source_sha'] == manifest['source_sha'] == sha
          assert proof['version'] == manifest['version'] == version
          assert proof['artifact_sha256'] == manifest['update']['sha256']
          assert proof['verified_files'] >= 4
          assert proof['negative_rejections'] == 7
          assert proof['test_only_ephemeral_key'] is True
          assert proof['publisher_signature_verified'] is False
          assert proof['code_update_performed'] is False
          assert proof['production_ready'] is False
          assert manifest['published'] is False
          assert manifest['publisher_signature_verified'] is False
          assert not (directory / 'latest.json').exists()
          PY
      - name: Attach same-commit Android debug QA APK as inspection evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Only a completed, successful main push run on this exact SHA may
          # supply Android QA bytes. A different ref, PR head or old APK is not
          # a valid companion to this Setup/Update candidate.
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&event=push&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"${SOURCE_SHA}\" and .name == \"PR CI\" and .event == \"push\" and .conclusion == \"success\")) | .[0].id")"
          test -n "$run_id" && test "$run_id" != null
          mkdir -p dist/candidates/android-qa
          gh run download "$run_id" \
            --name "WalidSite-Android-debug-QA-${SOURCE_SHA}" \
            --dir dist/candidates/android-qa
          # Rehash both real release ZIPs and the native APK together.
          # Any source/version mismatch or altered SHA sidecar blocks upload.
          PYTHONPATH="$PWD" python3 qa/verify_release_android_qa.py \
            --dir dist/candidates/android-qa --checkout . --sha "$SOURCE_SHA" \
            --candidates dist/candidates \
            > dist/candidates/unified-release-evidence.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('dist/candidates/unified-release-evidence.json').read_text())
          assert result['schema'] == 'walidsite.unpublished-full-release-candidate.v1'
          assert result['source_sha'] == os.environ['SOURCE_SHA']
          assert result['version'] == os.environ['CANDIDATE_VERSION']
          assert result['native_and_web_version_match'] is True
          assert result['same_sha_assets_verified'] is True
          assert result['php_zip_negative_rejections'] == 4
          assert result['test_only_ephemeral_key'] is True
          assert result['publisher_signature_verified'] is False
          assert result['android_distribution_signing_verified'] is False
          assert result['device_launch_verified'] is False
          assert result['code_update_performed'] is False
          assert result['production_ready'] is False
          PY
      - name: Retain unpublished inspection candidates only
        uses: actions/upload-artifact@v4
        with:
          name: WalidSite-UNPUBLISHED-candidates-${{ inputs.version }}-${{ github.sha }}
          path: |
            dist/candidates/*
            dist/candidate-build-receipt.json
          if-no-files-found: error
          retention-days: 14
  signed-android-inspection:
    # Signed native candidate ONLY. No trusted Web release or live-host
    # pairing is implied; no GitHub Release/upload publication occurs here.
    needs: release-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Require current Android SDK for independently verified APK bytes
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/build-tools"
          test -d "$sdk_root/platforms"
      - name: Build signed, site-bound but UNPUBLISHED Android release inspection
        shell: bash
        env:
          WALIDSITE_PRODUCTION_SITE_ORIGIN: ${{ vars.WALIDSITE_PRODUCTION_SITE_ORIGIN }}
          WALIDSITE_ANDROID_SIGNER_SHA256: ${{ vars.WALIDSITE_ANDROID_SIGNER_SHA256 }}
          WALIDSITE_ANDROID_KEYSTORE_BASE64: ${{ secrets.WALIDSITE_ANDROID_KEYSTORE_BASE64 }}
          WALIDSITE_ANDROID_KEY_ALIAS: ${{ secrets.WALIDSITE_ANDROID_KEY_ALIAS }}
          WALIDSITE_ANDROID_STORE_PASSWORD: ${{ secrets.WALIDSITE_ANDROID_STORE_PASSWORD }}
          WALIDSITE_ANDROID_KEY_PASSWORD: ${{ secrets.WALIDSITE_ANDROID_KEY_PASSWORD }}
          WALIDSITE_SOURCE_SHA: ${{ github.sha }}
          WALIDSITE_RELEASE_VERSION: ${{ inputs.version }}
        run: bash qa/build_origin_bound_android_release.sh
      - name: Retain signed Android evidence without implying a public APK
        uses: actions/upload-artifact@v4
        with:
          name: WalidSite-SIGNED-UNPUBLISHED-Android-${{ inputs.version }}-${{ github.sha }}
          path: dist/release-android/*
          if-no-files-found: error
          retention-days: 14

  release-gate:
    needs: [release-candidates, signed-android-inspection]
    runs-on: ubuntu-latest
    steps:
      - name: Block release until authorized staging and publisher acceptance
        shell: bash
        run: |
          echo 'BLOCKED EXTERNAL: no publisher-signed Web publication, real cPanel HTTPS install/update/recovery, verified live Web-APK pairing, or owner device acceptance.'
          echo 'Web candidates remain test-signed/unpublished; a signed Android inspection is also UNPUBLISHED and not production-attested.'
          exit 1
