name: Release
on:
  # Generate inspection-only release candidates after an accepted main push CI.
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable SemVer candidate version (e.g. 1.2.3); never implies production acceptance'
        required: true
        type: string
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release-candidates:
    # workflow_run.github.sha is NOT the triggering commit: use its head SHA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      source_sha: ${{ steps.verified-ci.outputs.source_sha }}
      version: ${{ steps.verified-version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Require one successful exact-main push CI run with all same-run native jobs
        id: verified-ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            test "$GITHUB_REF" = 'refs/heads/main'
          else
            test "$GITHUB_EVENT_NAME" = 'workflow_run'
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TESTED_SHA"
          runs_json="$(mktemp)"
          jobs_json="$(mktemp)"
          trap 'rm -f "$runs_json" "$jobs_json"' EXIT
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TESTED_SHA}&event=push&per_page=100" > "$runs_json"
          ci_run_id="$(python3 qa/verify_exact_main_release_ci.py \
            --runs "$runs_json" --sha "$TESTED_SHA" --repo "$GITHUB_REPOSITORY")"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/jobs?per_page=100" > "$jobs_json"
          mkdir -p dist
          python3 qa/verify_exact_main_release_ci.py \
            --runs "$runs_json" --jobs "$jobs_json" --run-id "$ci_run_id" \
            --sha "$TESTED_SHA" --repo "$GITHUB_REPOSITORY" \
            > dist/exact-main-ci-receipt.json
          printf 'ci_run_id=%s\n' "$ci_run_id" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$TESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Resolve immutable version from the exact tested checkout
        id: verified-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < backend/VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            test -n "$REQUESTED_VERSION"
            test "$REQUESTED_VERSION" = "$version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_mysql, zip, sodium
      - name: Install trusted production dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Produce versioned Setup and Update inspection candidates
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.verified-version.outputs.version }}
          SOURCE_SHA: ${{ steps.verified-ci.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/candidates
          python3 qa/build_cpanel_package.py \
            --source . --output dist/WalidSite-cPanel.zip --sha "$SOURCE_SHA"
          (cd dist && sha256sum --check WalidSite-cPanel.zip.sha256)
          PYTHONPATH="$PWD" python3 qa/prepare_release_candidate.py \
            --cpanel-zip dist/WalidSite-cPanel.zip \
            --output-dir dist/candidates \
            --version "$CANDIDATE_VERSION" --sha "$SOURCE_SHA" \
            > dist/candidate-build-receipt.json
          (cd dist/candidates && sha256sum --check ./*.sha256)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/candidate-build-receipt.json').read_text())
          assert data['candidate_prepared'] is True
          assert data['source_sha'] == os.environ['SOURCE_SHA']
          assert data['production_ready'] is False
          assert data['published'] is False
          assert data['publisher_signature_verified'] is False
          assert all(value is False for value in data['acceptance'].values())
          assert not (Path('dist/candidates') / 'latest.json').exists()
          PY
      - name: Verify real Update ZIP with PHP Ed25519 and archive safety boundary
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.verified-version.outputs.version }}
          SOURCE_SHA: ${{ steps.verified-ci.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          php qa/cpanel_signed_update_artifact_probe.php \
            dist/candidates "${CANDIDATE_VERSION}" "${SOURCE_SHA}" \
            > dist/candidates/signed-zip-acceptance.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('dist/candidates')
          version, sha = os.environ['CANDIDATE_VERSION'], os.environ['SOURCE_SHA']
          manifest = json.loads((directory / f'WalidSite-Release-Manifest-v{version}.json').read_text())
          proof = json.loads((directory / 'signed-zip-acceptance.json').read_text())
          assert proof['schema'] == 'walidsite.signed-zip-ci-acceptance.v1'
          assert proof['source_sha'] == manifest['source_sha'] == sha
          assert proof['version'] == manifest['version'] == version
          assert proof['artifact_sha256'] == manifest['update']['sha256']
          assert proof['verified_files'] >= 4
          assert proof['negative_rejections'] == 7
          assert proof['test_only_ephemeral_key'] is True
          assert proof['publisher_signature_verified'] is False
          assert proof['code_update_performed'] is False
          assert proof['production_ready'] is False
          assert manifest['published'] is False
          assert manifest['publisher_signature_verified'] is False
          assert not (directory / 'latest.json').exists()
          PY
      - name: Attach same-commit Android debug QA APK as inspection evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.verified-ci.outputs.source_sha }}
          CANDIDATE_VERSION: ${{ steps.verified-version.outputs.version }}
          CI_RUN_ID: ${{ steps.verified-ci.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          # Only a completed, successful main push run on this exact SHA may
          # supply Android QA bytes. A different ref, PR head or old APK is not
          # a valid companion to this Setup/Update candidate.
          # Reuse the *same* verified CI run. A second search could select
          # different (older) QA bytes despite passing the release gate.
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p dist/candidates/android-qa
          gh run download "$CI_RUN_ID" \
            --name "WalidSite-Android-debug-QA-${SOURCE_SHA}" \
            --dir dist/candidates/android-qa
          # Rehash both real release ZIPs and the native APK together.
          # Any source/version mismatch or altered SHA sidecar blocks upload.
          PYTHONPATH="$PWD" python3 qa/verify_release_android_qa.py \
            --dir dist/candidates/android-qa --checkout . --sha "$SOURCE_SHA" \
            --candidates dist/candidates \
            > dist/candidates/unified-release-evidence.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('dist/candidates/unified-release-evidence.json').read_text())
          assert result['schema'] == 'walidsite.unpublished-full-release-candidate.v1'
          assert result['source_sha'] == os.environ['SOURCE_SHA']
          assert result['version'] == os.environ['CANDIDATE_VERSION']
          assert result['native_and_web_version_match'] is True
          assert result['same_sha_assets_verified'] is True
          # The actual PHP signed Update ZIP gate reports all seven negative cases.
          assert result['php_zip_negative_rejections'] == 7
          assert result['test_only_ephemeral_key'] is True
          assert result['publisher_signature_verified'] is False
          assert result['android_distribution_signing_verified'] is False
          assert result['device_launch_verified'] is False
          assert result['code_update_performed'] is False
          assert result['production_ready'] is False
          PY
      - name: Retain unpublished inspection candidates only
        uses: actions/upload-artifact@v4
        with:
          name: WalidSite-UNPUBLISHED-candidates-${{ steps.verified-version.outputs.version }}-${{ steps.verified-ci.outputs.source_sha }}
          path: |
            dist/candidates/*
            dist/candidate-build-receipt.json
            dist/exact-main-ci-receipt.json
          if-no-files-found: error
          retention-days: 14
  signed-web-inspection:
    # Production signing secrets are deliberately NEVER available to automatic
    # workflow_run candidate builds. This job cannot publish or deploy.
    if: github.event_name == 'workflow_dispatch'
    needs: release-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-candidates.outputs.source_sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium
      - name: Retrieve the same-run unpublished Web and Android evidence
        uses: actions/download-artifact@v4
        with:
          name: WalidSite-UNPUBLISHED-candidates-${{ needs.release-candidates.outputs.version }}-${{ needs.release-candidates.outputs.source_sha }}
          path: dist/from-candidates
      - name: Verify actual candidate ZIPs and same-SHA Android QA bytes again
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.release-candidates.outputs.source_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 qa/verify_release_android_qa.py \
            --dir dist/from-candidates/candidates/android-qa \
            --checkout . --sha "$SOURCE_SHA" \
            --candidates dist/from-candidates/candidates \
            > dist/signed-web-preflight.json
      - name: Prepare private immutable Update bytes and unsigned payload
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.release-candidates.outputs.source_sha }}
          CANDIDATE_VERSION: ${{ needs.release-candidates.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -m 700 dist/signed-web
          PYTHONPATH="$PWD" python3 qa/prepare_signed_web_inspection.py \
            --candidates dist/from-candidates/candidates \
            --output-dir dist/signed-web \
            --version "$CANDIDATE_VERSION" --sha "$SOURCE_SHA" \
            > dist/signed-web-preparation.json
      - name: Sign private Web candidate using real publisher key (MANUAL ONLY)
        shell: bash
        env:
          WALIDSITE_PUBLISHER_SECRET_KEY_B64: ${{ secrets.WALIDSITE_PUBLISHER_SECRET_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WALIDSITE_PUBLISHER_SECRET_KEY_B64"
          php qa/sign_trusted_update_release.php "$PWD/dist/signed-web" \
            < dist/signed-web/unsigned-payload.json
      - name: Independently verify pinned publisher and PHP archive (NO DEPLOY)
        shell: bash
        env:
          WALIDSITE_PUBLISHER_PUBLIC_KEY_B64: ${{ vars.WALIDSITE_PUBLISHER_PUBLIC_KEY_B64 }}
          WALIDSITE_TRUSTED_RELEASE_ORIGIN: ${{ vars.WALIDSITE_TRUSTED_RELEASE_ORIGIN }}
          SOURCE_SHA: ${{ needs.release-candidates.outputs.source_sha }}
          CANDIDATE_VERSION: ${{ needs.release-candidates.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$WALIDSITE_PUBLISHER_PUBLIC_KEY_B64"
          test -n "$WALIDSITE_TRUSTED_RELEASE_ORIGIN"
          php qa/verify_signed_web_inspection.php "$PWD/dist/signed-web" \
            "$CANDIDATE_VERSION" "$SOURCE_SHA" \
            > dist/signed-web/inspection-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('dist/signed-web/inspection-receipt.json').read_text())
          assert result['schema'] == 'walidsite.signed-web-inspection.v1'
          assert result['publisher_signature_verified'] is True
          assert result['archive_integrity_verified'] is True
          assert result['published'] is False
          assert result['deployed'] is False
          assert result['production_ready'] is False
          PY
      - name: Retain signed BUT UNPUBLISHED Web inspection assets
        uses: actions/upload-artifact@v4
        with:
          name: WalidSite-SIGNED-UNPUBLISHED-Web-${{ needs.release-candidates.outputs.version }}-${{ needs.release-candidates.outputs.source_sha }}
          path: |
            dist/signed-web/*
            dist/signed-web-preflight.json
            dist/signed-web-preparation.json
          if-no-files-found: error
          retention-days: 14

  signed-android-inspection:
    # Never expose production signing secrets to automatic CI-follow-up runs.
    if: github.event_name == 'workflow_dispatch'
    # Signed native candidate ONLY. No trusted Web release or live-host
    # pairing is implied; no GitHub Release/upload publication occurs here.
    needs: release-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-candidates.outputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Require current Android SDK for independently verified APK bytes
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/build-tools"
          test -d "$sdk_root/platforms"
      - name: Build signed, site-bound but UNPUBLISHED Android release inspection
        shell: bash
        env:
          WALIDSITE_PRODUCTION_SITE_ORIGIN: ${{ vars.WALIDSITE_PRODUCTION_SITE_ORIGIN }}
          WALIDSITE_ANDROID_SIGNER_SHA256: ${{ vars.WALIDSITE_ANDROID_SIGNER_SHA256 }}
          WALIDSITE_ANDROID_KEYSTORE_BASE64: ${{ secrets.WALIDSITE_ANDROID_KEYSTORE_BASE64 }}
          WALIDSITE_ANDROID_KEY_ALIAS: ${{ secrets.WALIDSITE_ANDROID_KEY_ALIAS }}
          WALIDSITE_ANDROID_STORE_PASSWORD: ${{ secrets.WALIDSITE_ANDROID_STORE_PASSWORD }}
          WALIDSITE_ANDROID_KEY_PASSWORD: ${{ secrets.WALIDSITE_ANDROID_KEY_PASSWORD }}
          WALIDSITE_SOURCE_SHA: ${{ needs.release-candidates.outputs.source_sha }}
          WALIDSITE_RELEASE_VERSION: ${{ needs.release-candidates.outputs.version }}
        run: bash qa/build_origin_bound_android_release.sh
      - name: Retain signed Android evidence without implying a public APK
        uses: actions/upload-artifact@v4
        with:
          name: WalidSite-SIGNED-UNPUBLISHED-Android-${{ needs.release-candidates.outputs.version }}-${{ needs.release-candidates.outputs.source_sha }}
          path: dist/release-android/*
          if-no-files-found: error
          retention-days: 14

  release-gate:
    # Automation produces inspection artifacts only; no public promotion.
    if: github.event_name == 'workflow_dispatch'
    needs: [release-candidates, signed-web-inspection, signed-android-inspection]
    runs-on: ubuntu-latest
    steps:
      - name: Block release until authorized staging and publisher acceptance
        shell: bash
        run: |
          echo 'BLOCKED EXTERNAL: no publisher-signed Web publication, real cPanel HTTPS install/update/recovery, verified live Web-APK pairing, or owner device acceptance.'
          echo 'Web candidates remain test-signed/unpublished; a signed Android inspection is also UNPUBLISHED and not production-attested.'
          exit 1
