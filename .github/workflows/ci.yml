name: PR CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  # Preserve a running main build so the installer artifact can finish.
  # Still cancel obsolete PR-head checks after a new PR commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  required-ci-gate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: walidsite-root
          MARIADB_DATABASE: walidsite_test
          MARIADB_USER: walidsite
          MARIADB_PASSWORD: walidsite-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull-request CI must execute the submitted head, not GitHub's
          # synthetic merge ref. Push runs keep testing their push SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate immutable v6 reference pack
        run: python3 qa/validate_pack.py
      - name: Enforce owner-approved WEB-01 WEB-03 WEB-04 design freeze
        run: |
          python3 qa/validate_owner_design_freeze.py
          python3 -m unittest qa.tests.test_owner_design_freeze -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce exact visual reference mapping and pixel-parity evidence
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python qa/validate_visual_fidelity.py
          python -m unittest discover -s qa/tests -p 'test_visual_*.py'
      - name: Verify cPanel ZIP safety rules
        run: |
          python3 -m unittest discover -s qa/tests -p test_cpanel_package.py
          python3 -m unittest qa.tests.test_staging_smoke -v
      - name: Validate active CI workflow policy
        run: python3 qa/validate_ci_policy.py
      - name: Enforce exclusive Issue, branch and PR ownership
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 qa/validate_pr_ownership.py
      - name: Test PR ownership policy locally
        run: python3 -m unittest qa.tests.test_pr_ownership -v
      - name: Verify fail-closed legacy duplicate branch reconciliation
        run: python3 -m unittest discover -s qa/tests -p 'test_abandoned_branch_cleanup.py'
      - name: Validate canonical owner CV source
        run: python3 qa/validate_owner_cv.py
      - name: Reject merge markers and known sensitive files
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!*.lock'; then echo 'Unresolved merge markers'; exit 1; fi
          if git ls-files | grep -Ei '(^|/)(\.env$|walidatiya_walid\.sql$|id_rsa$|id_ed25519$|.*\.p12$|.*\.p8$)'; then echo 'Sensitive source file tracked'; exit 1; fi
      - name: Explain bootstrap baseline
        shell: bash
        run: |
          if test ! -f backend/composer.json || test ! -f mobile/pubspec.yaml; then
            echo 'BASELINE ONLY: app scaffolds are not yet present; this CI checks the reference pack, NOT a runnable app.'
          fi
      - uses: shivammathur/setup-php@v2
        if: ${{ hashFiles('backend/composer.json') != '' }}
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, pdo_mysql, zip, sodium
      - name: Verify publisher ZIP signature and structural acceptance (mandatory)
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          php -r 'exit(extension_loaded("zip") && extension_loaded("sodium") ? 0 : 1);'
          php -l qa/sign_trusted_update_release.php
          php -l qa/cpanel_signed_update_artifact_probe.php
          php -l qa/cpanel_signed_code_install_acceptance.php
          python3 -m unittest -v \
            qa.tests.test_visual_trusted_update_publication \
            qa.tests.test_visual_publisher_consumer_acceptance \
            qa.tests.test_visual_signed_update_cross_language_acceptance
      - name: Laravel tests (mandatory once scaffold exists)
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        run: |
          cd backend
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test
      - name: Verify booted Laravel API registrations against canonical OpenAPI
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: walidsite_test
          DB_USERNAME: walidsite
          DB_PASSWORD: walidsite-password
        run: |
          set -euo pipefail
          python3 -m unittest qa.tests.test_visual_runtime_api_parity -v
          route_json="$(mktemp)"
          trap 'rm -f "$route_json"' EXIT
          (cd backend && php artisan route:list --json --path=api/v1 --no-ansi) > "$route_json"
          python3 -m qa.runtime_api_route_parity --root . --artisan-json "$route_json"
      - name: Verify generated Update ZIP with real PHP signed archive gate (mandatory)
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        run: |
          python3 -m unittest -v \
            qa.tests.test_visual_release_candidates.ReleaseCandidateTest.test_real_update_zip_matches_php_signed_release_archive_contract
      - name: MariaDB migration and owner CV idempotency smoke
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: walidsite_test
          DB_USERNAME: walidsite
          DB_PASSWORD: walidsite-password
        run: |
          cd backend
          php artisan migrate:fresh --force
          php artisan db:seed --class=OwnerCvBaselineSeeder --force
          php artisan db:seed --class=OwnerCvBaselineSeeder --force
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $expected = ["users" => 1, "profiles" => 1, "career_positions" => 4, "certifications" => 5, "skills" => 25, "profile_skill" => 25, "professional_claims" => 1];
          foreach ($expected as $table => $count) {
              $actual = Illuminate\Support\Facades\DB::table($table)->count();
              if ($actual !== $count) {
                  fwrite(STDERR, "$table expected $count rows, got $actual\n");
                  exit(1);
              }
          }
          $db = Illuminate\Support\Facades\DB::class;
          if ($db::table("users")->whereNotNull("password_hash")->exists()
              || $db::table("role_user")->count() !== 0
              || $db::table("career_positions")->where("publishable", true)->orWhere("verified", true)->exists()
              || $db::table("certifications")->where("verified", true)->exists()
              || $db::table("professional_claims")->where("is_public", true)->exists()) {
              fwrite(STDERR, "Owner baseline leaked credentials, roles, or unreviewed public claims\n");
              exit(1);
          }
          echo "PASS: MariaDB migration and repeated owner CV seed are idempotent and fail-closed\n";
          '
      - name: Verify actual cPanel private data and MariaDB disposable recovery
        if: ${{ hashFiles('backend/composer.json') != '' }}
        env:
          CI_RECOVERY_HOST: 127.0.0.1
          CI_RECOVERY_ROOT_PASSWORD: walidsite-root
        run: php qa/cpanel_update_recovery_acceptance.php
      - name: Issue 481 real authenticated Admin runtime diagnostics
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/481-') || startsWith(github.head_ref, 'fix/481-') || startsWith(github.head_ref, 'chore/481-')) }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: walidsite_test
          DB_USERNAME: walidsite
          DB_PASSWORD: walidsite-password
          CACHE_STORE: array
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
          WALIDSITE_RENDER_BASE_URL: http://127.0.0.1:8000
          WALIDSITE_QA_ADMIN_ORIGIN: http://127.0.0.1:8000
          WALIDSITE_QA_ADMIN_LOCALE: en
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "${{ github.event.pull_request.head.sha }}"
          export WALIDSITE_QA_ADMIN_PASSWORD="$(python3 - <<'PY'
          import secrets
          print('Visual-' + secrets.token_urlsafe(24) + '-A9!')
          PY
          )"

          cd backend
          rm -f storage/app/site-installed.lock
          php artisan migrate:fresh --force
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          config([
              "site.setup_enabled" => true,
              "site.setup_token" => str_repeat("v", 40),
              "site.setup_database_ready" => false,
              "site.install_lock_path" => storage_path("app/site-installed.lock"),
          ]);
          $installer = app(App\Support\Deployment\SiteInstaller::class);
          $ok = $installer->complete(
              getenv("WALIDSITE_QA_ADMIN_PASSWORD"),
              app(App\Support\Deployment\SiteUpdater::class)
          );
          if (! $ok) { fwrite(STDERR, "Visual QA owner activation was not completed\\n"); exit(2); }
          file_put_contents("/tmp/walidsite-admin-email", $installer->ownerEmail());
          $provider = App\Models\AiProvider::create([
              "display_name" => "Visual QA provider",
              "provider_type" => "ollama-compatible",
              "base_url" => "http://127.0.0.1:11434",
              "secret_ciphertext" => null,
              "enabled" => false,
              "health_status" => "unverified",
              "routing_priority" => 90,
              "concurrent_limit" => 1,
              "timeout_seconds" => 5,
              "daily_budget_minor" => 500,
              "currency" => "USD",
          ]);
          file_put_contents("/tmp/walidsite-admin-provider-id", (string) $provider->id);
          '
          cd ..

          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium

          cd backend
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/walidsite-admin-visual.log 2>&1 &
          server_pid=$!
          cd ..
          session_dir=""
          plan_dir=""
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            if test -n "$session_dir"; then rm -rf -- "$session_dir"; fi
            if test -n "$plan_dir"; then rm -rf -- "$plan_dir"; fi
            unset WALIDSITE_QA_ADMIN_PASSWORD WALIDSITE_QA_ADMIN_EMAIL WALIDSITE_CAPTURE_STORAGE_STATE
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/admin/login >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/walidsite-admin-visual.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/admin/login >/dev/null

          export WALIDSITE_QA_ADMIN_EMAIL="$(cat /tmp/walidsite-admin-email)"
          if ! session_output="$(python3 qa/admin_visual_session.py)"; then
            echo "Admin session helper rejected the local runtime; server diagnostics follow"
            cat /tmp/walidsite-admin-visual.log
            exit 1
          fi
          unset WALIDSITE_QA_ADMIN_EMAIL
          export WALIDSITE_CAPTURE_STORAGE_STATE="$(printf '%s\n' "$session_output" | sed -n 's/^WALIDSITE_CAPTURE_STORAGE_STATE=//p')"
          test -n "$WALIDSITE_CAPTURE_STORAGE_STATE"
          session_dir="$(dirname "$WALIDSITE_CAPTURE_STORAGE_STATE")"
          provider_id="$(cat /tmp/walidsite-admin-provider-id)"
          plan_dir="$(mktemp -d /tmp/walidsite-admin-plan.XXXXXX)"
          plan_path="$plan_dir/admin-plan.json"
          python3 qa/build_admin_visual_plan.py --provider-id "$provider_id" --locale en --dpr 1 --timeout 120 --output "$plan_path"

          # Earlier mandatory test/install steps legitimately generate only these
          # untracked build caches. Remove exact generated paths; never reset or
          # clean arbitrary source before provenance attestation.
          git clean -fd -- backend/composer.lock qa/__pycache__ qa/tests/__pycache__
          export PYTHONDONTWRITEBYTECODE=1
          dirty_status="$(git status --porcelain=v1 --untracked-files=all)"
          if test -n "$dirty_status"; then
            echo "Visual attestation found repository changes before capture (status/path only):"
            printf '%s\n' "$dirty_status"
            exit 3
          fi

          set +e
          python3 qa/visual_diagnostics.py --plan "$plan_path" --commit "$tested_sha"
          diagnostic_exit=$?
          set -e
          if test "$diagnostic_exit" -gt 1; then
            echo "Admin visual diagnostics failed before producing comparable runtime pixels"
            exit "$diagnostic_exit"
          fi

          REPORT_PATH="qa/visual-diagnostics/$tested_sha/report.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['REPORT_PATH']).read_text(encoding='utf-8'))
          screens = report.get('screens', {})
          expected = {f'ADMIN-{index:02d}' for index in range(1, 14)}
          if set(screens) != expected:
              raise SystemExit('Admin diagnostics did not cover exactly ADMIN-01..13')
          allowed = {'mismatch', 'exact_pixels_unattested'}
          invalid = {sid: row.get('status') for sid, row in screens.items() if row.get('status') not in allowed}
          if invalid:
              raise SystemExit('Admin renderer/runtime failure: ' + json.dumps(invalid, sort_keys=True))
          mismatches = {sid: row.get('mismatching_rgba_pixels', 0) for sid, row in screens.items()}
          print('REAL ADMIN RUNTIME CAPTURES VERIFIED: 13/13 renderer/auth/route/PNG checks passed')
          print('ZERO-RGBA MATCHES: ' + str(sum(value == 0 for value in mismatches.values())) + '/13')
          print('MISMATCH COUNTS: ' + json.dumps(mismatches, sort_keys=True))
          PY

          # Read-only Admin AR/EN desktop/mobile accessibility diagnostics.
          # Defects stay recorded; pixel parity is never inferred from CI.
          set +e
          python3 -B qa/audit_admin_runtime.py --provider-id "$provider_id" --commit "$tested_sha" --output "/home/runner/work/WalidSite/WalidSite/qa/visual-diagnostics/$tested_sha/admin-runtime-a11y.json"
          a11y_exit=$?
          set -e
          if test "$a11y_exit" -gt 1; then exit "$a11y_exit"; fi

          # Real Web diagnostics reuse this already-verified local Laravel
          # server. The two dynamic pages require actual published source data;
          # static pages never substitute invented project/article records.
          # Admin diagnostics use an authenticated Playwright session. Public
          # diagnostics must be anonymous and must not inherit that identity.
          unset WALIDSITE_CAPTURE_STORAGE_STATE
          web_plan_path="$plan_dir/web-plan.json"
          python3 -B qa/build_web_visual_plan.py --locale en --dpr 1 --timeout 120 --output "$web_plan_path"
          set +e
          python3 -B qa/visual_diagnostics.py --plan "$web_plan_path" --commit "$tested_sha" --group web
          web_exit=$?
          set -e
          if test "$web_exit" -gt 1; then
            echo "Web visual diagnostics failed before producing comparable runtime pixels"
            exit "$web_exit"
          fi
          REPORT_PATH="qa/visual-diagnostics/$tested_sha-web/report.json" python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          screens = report.get("screens", {})
          expected = {f"WEB-{i:02d}" for i in range(1, 15)} - {"WEB-05", "WEB-08"}
          if set(screens) != expected:
              raise SystemExit("Web diagnostics must cover exactly 12 routable public Web pages")
          allowed = {"mismatch", "exact_pixels_unattested"}
          invalid = {sid: row.get("status") for sid, row in screens.items()
                     if row.get("status") not in allowed}
          if invalid:
              raise SystemExit("Web renderer/runtime failure: " + json.dumps(invalid, sort_keys=True))
          if any(row.get("runtime_size") != row.get("reference_size") for row in screens.values()):
              raise SystemExit("Web runtime PNG dimensions disagree with immutable references")
          print("REAL WEB RUNTIME CAPTURES VERIFIED: 12/12 currently routable static pages")
          print("WEB ZERO-RGBA MATCHES: " + str(sum(
              row.get("mismatching_rgba_pixels", 0) == 0 for row in screens.values()
          )) + "/12")
          print("WEB-06 AI Engineering: captured on the real Laravel GET route")
          print("DYNAMIC WEB-05/08: pending approved published slugs; not fabricated")
          PY

      - name: Upload Issue 481 Admin runtime visual diagnostics
        if: ${{ always() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/481-') || startsWith(github.head_ref, 'fix/481-') || startsWith(github.head_ref, 'chore/481-')) }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-481-admin-and-web-runtime-visual-diagnostics
          path: qa/visual-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: T007 real Laravel visual diagnostics
        id: t007_visual_diagnostics
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'feat/T007-runtime-parity-final' || (startsWith(github.head_ref, 'feat/') && (contains(github.head_ref, '-web-') || contains(github.head_ref, '-WEB-')))) }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/t007-visual.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
          WALIDSITE_RENDER_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          renderer_sha="$(git rev-parse HEAD)"
          test "$renderer_sha" = "${{ github.event.pull_request.head.sha }}"
          export GITHUB_SHA="$renderer_sha"
          touch backend/database/t007-visual.sqlite
          cd backend
          php artisan migrate:fresh --force
          php artisan db:seed --class=T007VisualCaptureSeeder --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/walidsite-t007.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd ..
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/walidsite-t007.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
          python qa/capture_t007_diagnostics.py --commit "$(git rev-parse HEAD)" --locale en --dpr 1

      - name: Upload T007 runtime visual diagnostics
        if: ${{ always() && steps.t007_visual_diagnostics.outcome != 'skipped' && github.event_name == 'pull_request' && (github.head_ref == 'feat/T007-runtime-parity-final' || (startsWith(github.head_ref, 'feat/') && (contains(github.head_ref, '-web-') || contains(github.head_ref, '-WEB-')))) }}
        uses: actions/upload-artifact@v4
        with:
          name: T007-runtime-visual-diagnostics
          path: qa/visual-diagnostics/T007
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('backend/package.json') != '' }}
        with:
          node-version: '22'
      - name: Web build and tests (mandatory once scaffold exists)
        if: ${{ hashFiles('backend/package.json') != '' }}
        shell: bash
        run: |
          cd backend
          npm ci
          npm run lint
          npm run test -- --run
          npm run build
      - uses: subosito/flutter-action@v2
        if: ${{ hashFiles('mobile/pubspec.yaml') != '' }}
        with:
          channel: stable
      - name: Flutter analyze and tests (mandatory once scaffold exists)
        if: ${{ hashFiles('mobile/pubspec.yaml') != '' }}
        shell: bash
        run: |
          cd mobile
          flutter pub get
          flutter analyze
          flutter test

  build-cpanel-package:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       (github.head_ref == 'fix/732-cpanel-first-boot-missing-key' ||
        github.head_ref == 'fix/26-cpanel-full-install-ci-acceptance' ||
        github.head_ref == 'fix/26-foodex15-zip-mariadb-acceptance' ||
        github.head_ref == 'feat/732-cpanel-immutable-code-pointer') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: required-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: walidsite-ci-root
          MARIADB_DATABASE: walidsite_ci_install
          MARIADB_USER: walidsite_ci
          MARIADB_PASSWORD: walidsite-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mariadb_foodex:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: walidsite-ci-root
          MARIADB_DATABASE: walidsite_ci_foodex
          MARIADB_USER: walidsite_ci
          MARIADB_PASSWORD: walidsite-ci-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_mysql, zip
      - name: Prepare production dependencies
        run: |
          cd backend
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Package trusted checked-in code for cPanel
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$source_sha" != "$PR_HEAD_SHA" ]]; then
            echo "Wrong PR source commit"; exit 1
          fi
          version="$(cat backend/VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid version"; exit 1
          fi
          package="dist/WalidSite-Setup-v${version}.zip"
          python3 qa/build_cpanel_package.py --source . --output "$package" --sha "$source_sha"
          unzip -t "$package"
          (cd dist && sha256sum --check "WalidSite-Setup-v${version}.zip.sha256")
          PACKAGE="$package" SOURCE_SHA="$source_sha" python3 -c 'from pathlib import Path; from qa.build_cpanel_package import verify_archive; import os; verify_archive(Path(os.environ["PACKAGE"]), os.environ["SOURCE_SHA"])'
          python3 qa/cpanel_first_run_http_probe.py --cpanel-zip "$package" --sha "$source_sha"
          # The same immutable Setup ZIP must complete a disposable MariaDB HTTP install.
          CI_INSTALL_DB_HOST=127.0.0.1 CI_INSTALL_DB_PORT=3306 \
            CI_INSTALL_DB_NAME=walidsite_ci_install CI_INSTALL_DB_USER=walidsite_ci \
            CI_INSTALL_DB_PASSWORD=walidsite-ci-password \
            python3 -m qa.cpanel_full_install_probe --cpanel-zip "$package" --sha "$source_sha"
          # Independently exercise the new FOODEX 15-stage wizard using a second
          # empty disposable MariaDB. Preserve the legacy /setup acceptance above.
          CI_FOODEX_DB_HOST=127.0.0.1 CI_FOODEX_DB_PORT=3307 \
            CI_FOODEX_DB_NAME=walidsite_ci_foodex CI_FOODEX_DB_USER=walidsite_ci \
            CI_FOODEX_DB_PASSWORD=walidsite-ci-password \
            python3 -m qa.cpanel_foodex_15_install_probe --cpanel-zip "$package" --sha "$source_sha"
          python3 qa/cpanel_release_barrier_probe.py --cpanel-zip "$package" --sha "$source_sha"
          # A code-only candidate MUST bind to this exact source SHA and version,
          # but never publish it without a separate private Ed25519 publisher gate.
          mkdir -p dist/unsigned-check
          python3 -m qa.build_trusted_update_release --cpanel-zip "$package" --output-dir dist/unsigned-check --version "$version" --sha "$source_sha" > dist/unsigned-check/receipt.json
          python3 -c 'import json; r=json.load(open("dist/unsigned-check/receipt.json")); assert r["update_artifact_prepared"] is True and r["publisher_signature_verified"] is False'
          (cd dist/unsigned-check && sha256sum "WalidSite-update-v${version}.zip" > "WalidSite-update-v${version}.zip.sha256")
          (cd dist/unsigned-check && sha256sum --check "WalidSite-update-v${version}.zip.sha256")
          # NO SIGNATURE: this is an isolated inspection artifact, not an
          # executable Admin update or a published release.
          printf '%s\n' 'UNSIGNED INSPECTION ONLY — DO NOT INSTALL ON A LIVE SITE.' \
            'The Super Admin Update ZIP endpoint requires an Ed25519 publisher-signed' \
            'catalog and verified host recovery/cutover. This candidate cannot satisfy' \
            'those security gates and cannot replace currently installed PHP code.' \
            > dist/unsigned-check/DO-NOT-INSTALL.txt
          # This is an inspection receipt only. Never copy old version-specific
          # release notes into a newer candidate.
          printf '# WalidSite v%s — UNSIGNED inspection only\n\nSource SHA: %s\n\nNot published, not signed, and not installable through Admin updates.\n' \
            "$version" "$source_sha" > dist/unsigned-check/RELEASE-NOTES.md
          # Produce one source-pinned, complete release train from the SAME
          # already validated Setup ZIP. Both ZIPs, their checksums, release
          # manifest and release notes remain explicitly unpublished.
          mkdir -p dist/release-train
          PYTHONPATH="$PWD" python3 -m qa.prepare_release_candidate \
            --cpanel-zip "$package" --output-dir dist/release-train \
            --version "$version" --sha "$source_sha" \
            > dist/release-train-receipt.json
          (cd dist/release-train && sha256sum --check ./*.sha256)
          SOURCE_SHA="$source_sha" VERSION="$version" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path("dist/release-train-receipt.json").read_text())
          assert receipt["candidate_prepared"] is True
          assert receipt["source_sha"] == os.environ["SOURCE_SHA"]
          assert receipt["version"] == os.environ["VERSION"]
          assert receipt["published"] is False
          assert receipt["production_ready"] is False
          assert receipt["publisher_signature_verified"] is False
          assert all(value is False for value in receipt["acceptance"].values())
          directory = Path("dist/release-train")
          assert not (directory / "latest.json").exists()
          manifest = json.loads(next(directory.glob("*Release-Manifest-*.json")).read_text())
          assert manifest == {k: v for k, v in receipt.items() if k != "candidate_prepared"}
          assert all((directory / receipt[k]["file"]).is_file() for k in ("setup", "update"))
          PY
          # The real Python-produced Update ZIP must also pass PHP's Ed25519
          # metadata and strict release archive gates on the exact built bytes.
          # This throwaway key never authorizes a production release or Apply.
          GITHUB_ACTIONS=true php qa/cpanel_signed_update_artifact_probe.php \
            dist/release-train "$version" "$source_sha" \
            > dist/release-train/signed-zip-acceptance.json
          SOURCE_SHA="$source_sha" VERSION="$version" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(Path("dist/release-train/signed-zip-acceptance.json").read_text())
          manifest = json.loads(next(Path("dist/release-train").glob("*Release-Manifest-*.json")).read_text())
          assert proof["schema"] == "walidsite.signed-zip-ci-acceptance.v1"
          assert proof["source_sha"] == os.environ["SOURCE_SHA"]
          assert proof["version"] == os.environ["VERSION"]
          assert proof["artifact_sha256"] == manifest["update"]["sha256"]
          assert proof["verified_files"] >= 4
          assert proof["negative_rejections"] == 7
          assert proof["test_only_ephemeral_key"] is True
          assert proof["publisher_signature_verified"] is False
          assert proof["code_update_performed"] is False
          assert proof["production_ready"] is False
          PY
          # Exercise the exact-source Setup and Update ZIPs with a test-only
          # Ed25519 key, separate MariaDB schemas, and the owner code installer.
          # This is not real HTTPS or independent foreign-writer certification.
          CI_RECOVERY_HOST=127.0.0.1 \
            CI_RECOVERY_ROOT_PASSWORD=walidsite-ci-root \
            GITHUB_ACTIONS=true php qa/cpanel_signed_code_install_acceptance.php \
              "$package" "dist/release-train/WalidSite-Update-v${version}.zip" \
              "$version" "$source_sha" \
              > dist/release-train/code-install-fixture-acceptance.json
          SOURCE_SHA="$source_sha" VERSION="$version" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(Path("dist/release-train/code-install-fixture-acceptance.json").read_text())
          assert proof["schema"] == "walidsite.disposable-code-install-acceptance.v1"
          assert proof["source_sha"] == os.environ["SOURCE_SHA"]
          assert proof["version"] == os.environ["VERSION"]
          assert proof["same_build_setup_and_update"] is True
          assert proof["signed_code_cutover_fixture"] is True
          assert proof["disposable_mariadb_restore"] is True
          assert proof["failed_health_pointer_reverted"] is True
          assert proof["real_https_host_verified"] is False
          assert proof["independent_foreign_writer_isolation"] is False
          assert proof["publisher_signature_verified_for_production"] is False
          assert proof["production_ready"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: WalidSite-Setup-installer
          path: dist/WalidSite-Setup-v*.zip*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: WalidSite-UNSIGNED-update-INSPECTION
          path: dist/unsigned-check/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain source-pinned UNPUBLISHED Setup and Update release train
        uses: actions/upload-artifact@v4
        with:
          # On pull_request, github.sha is the synthetic merge SHA, not the
          # checked-out source head. Label the artifact with the exact source
          # commit whose Setup and Update ZIPs were built and tested.
          name: WalidSite-UNPUBLISHED-release-train-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/release-train/*
            dist/release-train-receipt.json
          if-no-files-found: error
          retention-days: 14

  build-android-qa-apk:
    # Real native compilation, not the existing Flutter analyzer/widget suite.
    # Run on green main and the exact LEAD implementation PR only; do not
    # multiply native builds across every unrelated W1/W2/W3/W4 PR.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.head_ref == 'fix/751-native-android-qa-build-ci' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: required-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Pin native build to exact tested source
        id: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$EXPECTED_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate runner Android SDK without obsolete 'tools' package
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/build-tools"
          test -d "$sdk_root/platforms"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Extract expected native identity from tracked sources
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 qa/android_qa_build_metadata.py --github-output "$GITHUB_OUTPUT" > dist/android-qa-build-metadata.json
      - name: Compile real Android debug QA APK
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          cd mobile
          flutter pub get
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Inspect APK manifest, signature and real payload bytes
        shell: bash
        env:
          EXPECTED_PACKAGE_ID: ${{ steps.identity.outputs.package_id }}
          EXPECTED_VERSION_NAME: ${{ steps.identity.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/build-tools"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$aapt" && test -x "$apksigner"
          apk=mobile/build/app/outputs/flutter-apk/app-debug.apk
          python3 qa/native_android_acceptance.py \
            --apk "$apk" --kind debug --package-id "$EXPECTED_PACKAGE_ID" \
            --version-name "$EXPECTED_VERSION_NAME" --version-code "$EXPECTED_VERSION_CODE" \
            --source-sha "$SOURCE_SHA" --aapt "$aapt" --apksigner "$apksigner" \
            > dist/android-qa-verification.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          apk = Path("mobile/build/app/outputs/flutter-apk/app-debug.apk")
          data = json.loads(Path("dist/android-qa-verification.json").read_text())
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert data["apk_sha256"] == checksum and data["apk_integrity_verified"]
          assert data["debug_signature_verified"] and not data["production_ready"]
          assert not data["distribution_signing_identity_verified"]
          assert not data["device_install_launch_verified"]
          assert not data["ios_build_verified"]
          assert data["source_sha_supplied_not_attested"] == os.environ["SOURCE_SHA"]
          target = Path("dist/WalidSite-Android-debug-QA.apk")
          target.write_bytes(apk.read_bytes())
          (Path("dist") / (target.name + ".sha256")).write_text(checksum + "  " + target.name + "\n")
          PY
          (cd dist && sha256sum --check WalidSite-Android-debug-QA.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: WalidSite-Android-debug-QA-${{ steps.source.outputs.sha }}
          path: |
            dist/WalidSite-Android-debug-QA.apk
            dist/WalidSite-Android-debug-QA.apk.sha256
            dist/android-qa-verification.json
            dist/android-qa-build-metadata.json
          if-no-files-found: error
          retention-days: 30

  verify-source-pinned-release-bundle:
    # Fail closed if actual main Setup ZIP, Update ZIP and compiled APK
    # disagree on source SHA, release SemVer or test-only trust boundaries.
    # This is NOT a production release or a device smoke test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required-ci-gate, build-cpanel-package, build-android-qa-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: WalidSite-UNPUBLISHED-release-train-${{ github.sha }}
          path: dist/source-proof/release
      - uses: actions/download-artifact@v4
        with:
          name: WalidSite-Android-debug-QA-${{ github.sha }}
          path: dist/source-proof/android
      - name: Verify one immutable web and native artifact train
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -d dist/source-proof/release/release-train
          test -s dist/source-proof/android/WalidSite-Android-debug-QA.apk
          mkdir -p dist/source-proof/evidence
          PYTHONPATH="$PWD" python3 qa/verify_release_android_qa.py \
            --dir dist/source-proof/android --checkout . --sha "$SOURCE_SHA" \
            --candidates dist/source-proof/release/release-train \
            > dist/source-proof/evidence/unified-release-evidence.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads(Path('dist/source-proof/evidence/unified-release-evidence.json').read_text())
          version = Path('backend/VERSION').read_text().strip()
          assert proof['schema'] == 'walidsite.unpublished-full-release-candidate.v1'
          assert proof['source_sha'] == os.environ['SOURCE_SHA']
          assert proof['version'] == version
          assert proof['native_and_web_version_match'] is True
          assert proof['same_sha_assets_verified'] is True
          assert proof['php_zip_negative_rejections'] == 7
          assert proof['test_only_ephemeral_key'] is True
          assert proof['publisher_signature_verified'] is False
          assert proof['android_distribution_signing_verified'] is False
          assert proof['device_launch_verified'] is False
          assert proof['code_update_performed'] is False
          assert proof['production_ready'] is False
          PY
      - name: Retain non-production unified provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: WalidSite-UNPUBLISHED-unified-build-proof-${{ github.sha }}
          path: dist/source-proof/evidence/unified-release-evidence.json
          if-no-files-found: error
          retention-days: 14

  cleanup-merged-branch:
    # Runs only after an actual merge and only for a branch in this repository.
    # No checkout or execution of PR-provided code; never deletes a reused branch.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Safely remove merged short-lived branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$SOURCE_BRANCH" in
            feat/*|fix/*|chore/*) ;;
            *) echo "Preserving non-task branch: $SOURCE_BRANCH"; exit 0 ;;
          esac
          if [ "$SOURCE_BRANCH" = main ]; then exit 0; fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha' 2>/dev/null)" || {
            echo "Already deleted (or cannot read branch); no destructive action"
            exit 0
          }
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo "Branch has advanced since merge; preserve and investigate"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SOURCE_BRANCH}"
          echo "Deleted merged short-lived branch $SOURCE_BRANCH"

      # One-time reconciliation for a mistakenly created, EMPTY nonstandard
      # #25 preflight branch. Only the exact original main ancestor may go.
      # Do not touch the canonical merged branch or any unmerged work.
      - name: Reconcile exact empty Issue 25 preflight ref after its PR merge
        if: ${{ github.event.pull_request.number == 1015 }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          old_branch="test/25-runtime-artisan-api-parity"
          expected="836332ca98f15a6265fa3e80aaeb9d50410bca0c"
          ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${old_branch}"
          actual="$(gh api "$ref" --jq .object.sha 2>/dev/null)" || {
            echo "Old preflight branch already absent or unreadable; no deletion"; exit 0;
          }
          if [[ "$actual" != "$expected" ]]; then
            echo "Old branch advanced; preserving unique work"; exit 0;
          fi
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${expected}...main")"
          status="$(jq -r .status <<<"$comparison")"
          behind="$(jq -r .behind_by <<<"$comparison")"
          if [[ "$behind" != 0 || ( "$status" != ahead && "$status" != identical ) ]]; then
            echo "Old branch has unmerged work; preserving"; exit 0;
          fi
          open_count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f head="${GITHUB_REPOSITORY%%/*}:${old_branch}" --jq length)"
          if [[ "$open_count" != 0 ]]; then
            echo "Old branch is in an open PR; preserving"; exit 0;
          fi
          current="$(gh api "$ref" --jq .object.sha 2>/dev/null)" || exit 0
          if [[ "$current" != "$expected" ]]; then
            echo "Old branch changed during cleanup; preserving"; exit 0;
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${old_branch}"
          echo "Deleted exact, ancestor-only preflight branch ${old_branch}"
      - name: Reconcile pre-hook T001 branches after a verified merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # These two PRs merged before the guarded auto-cleanup job existed.
          # Keep this idempotent: absence or any ref movement means no deletion.
          while read -r pr_number branch expected_sha; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            merged="$(jq -r '.merged' <<<"${pr_json}")"
            pr_head="$(jq -r '.head.ref' <<<"${pr_json}")"
            pr_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            pr_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
            pr_base="$(jq -r '.base.ref' <<<"${pr_json}")"
            if [[ "${merged}" != true || "${pr_head}" != "${branch}" ||
                  "${pr_sha}" != "${expected_sha}" ||
                  "${pr_repo}" != "${GITHUB_REPOSITORY}" || "${pr_base}" != main ]]; then
              echo "Preserving ${branch}: PR provenance/merge does not match"
              continue
            fi

            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null)" || {
              echo "Already absent or unreadable: ${branch}; no deletion attempted"
              continue
            }
            if [[ "${current}" != "${expected_sha}" ]]; then
              echo "Preserving ${branch}: branch has advanced beyond merged PR"
              continue
            fi

            open_count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${GITHUB_REPOSITORY%%/*}:${branch}" --jq 'length')"
            if [[ "${open_count}" != 0 ]]; then
              echo "Preserving ${branch}: active PR found"
              continue
            fi

            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted verified merged legacy branch ${branch}"
          done <<'MERGED_PRE_HOOK'
          29 feat/T001-governance-and-ci c89c0a080515cb846e0a408e7ecb27c6d15de26f
          30 feat/T001-runtime-scaffold 1803e74a477217597eee93a6d9f210f775b66deb
          MERGED_PRE_HOOK

      # Execute only from trusted merged main, never from PR-provided code.
      # This one-time reconciliation has a pinned six-branch allowlist.
      - name: Checkout trusted main for abandoned duplicate reconciliation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prune verified abandoned duplicate branches only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 qa/cleanup_abandoned_duplicate_branches.py

  cleanup-480-orphans:
    # Prune only after green main tests and the main cPanel package.
    # PR-close cleanup must never invoke the orphan candidate path.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required-ci-gate, build-cpanel-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out exactly the CI-tested trusted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconcile only three SHA-pinned #480 orphan branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECONCILE_480_ORPHANS: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 qa/cleanup_abandoned_duplicate_branches.py
