name: PR CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  # Preserve a running main build so the installer artifact can finish.
  # Still cancel obsolete PR-head checks after a new PR commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  required-ci-gate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: walidsite-root
          MARIADB_DATABASE: walidsite_test
          MARIADB_USER: walidsite
          MARIADB_PASSWORD: walidsite-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull-request CI must execute the submitted head, not GitHub's
          # synthetic merge ref. Push runs keep testing their push SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate immutable v6 reference pack
        run: python3 qa/validate_pack.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce exact visual reference mapping and pixel-parity evidence
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python qa/validate_visual_fidelity.py
          python -m unittest discover -s qa/tests -p 'test_visual_*.py'
      - name: Verify cPanel ZIP safety rules
        run: |
          python3 -m unittest discover -s qa/tests -p test_cpanel_package.py
          python3 -m unittest qa.tests.test_staging_smoke -v
      - name: Validate active CI workflow policy
        run: python3 qa/validate_ci_policy.py
      - name: Enforce exclusive Issue, branch and PR ownership
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 qa/validate_pr_ownership.py
      - name: Test PR ownership policy locally
        run: python3 -m unittest qa.tests.test_pr_ownership -v
      - name: Verify fail-closed legacy duplicate branch reconciliation
        run: python3 -m unittest discover -s qa/tests -p 'test_abandoned_branch_cleanup.py'
      - name: Validate canonical owner CV source
        run: python3 qa/validate_owner_cv.py
      - name: Reject merge markers and known sensitive files
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!*.lock'; then echo 'Unresolved merge markers'; exit 1; fi
          if git ls-files | grep -Ei '(^|/)(\.env$|walidatiya_walid\.sql$|id_rsa$|id_ed25519$|.*\.p12$|.*\.p8$)'; then echo 'Sensitive source file tracked'; exit 1; fi
      - name: Explain bootstrap baseline
        shell: bash
        run: |
          if test ! -f backend/composer.json || test ! -f mobile/pubspec.yaml; then
            echo 'BASELINE ONLY: app scaffolds are not yet present; this CI checks the reference pack, NOT a runnable app.'
          fi
      - uses: shivammathur/setup-php@v2
        if: ${{ hashFiles('backend/composer.json') != '' }}
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, pdo_mysql
      - name: Laravel tests (mandatory once scaffold exists)
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        run: |
          cd backend
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test
      - name: MariaDB migration and owner CV idempotency smoke
        if: ${{ hashFiles('backend/composer.json') != '' }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: walidsite_test
          DB_USERNAME: walidsite
          DB_PASSWORD: walidsite-password
        run: |
          cd backend
          php artisan migrate:fresh --force
          php artisan db:seed --class=OwnerCvBaselineSeeder --force
          php artisan db:seed --class=OwnerCvBaselineSeeder --force
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $expected = ["users" => 1, "profiles" => 1, "career_positions" => 4, "certifications" => 5, "skills" => 25, "profile_skill" => 25, "professional_claims" => 1];
          foreach ($expected as $table => $count) {
              $actual = Illuminate\Support\Facades\DB::table($table)->count();
              if ($actual !== $count) {
                  fwrite(STDERR, "$table expected $count rows, got $actual\n");
                  exit(1);
              }
          }
          $db = Illuminate\Support\Facades\DB::class;
          if ($db::table("users")->whereNotNull("password_hash")->exists()
              || $db::table("role_user")->count() !== 0
              || $db::table("career_positions")->where("publishable", true)->orWhere("verified", true)->exists()
              || $db::table("certifications")->where("verified", true)->exists()
              || $db::table("professional_claims")->where("is_public", true)->exists()) {
              fwrite(STDERR, "Owner baseline leaked credentials, roles, or unreviewed public claims\n");
              exit(1);
          }
          echo "PASS: MariaDB migration and repeated owner CV seed are idempotent and fail-closed\n";
          '
      - name: Issue 481 real authenticated Admin runtime diagnostics
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/481-') }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: walidsite_test
          DB_USERNAME: walidsite
          DB_PASSWORD: walidsite-password
          CACHE_STORE: array
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
          WALIDSITE_RENDER_BASE_URL: http://127.0.0.1:8000
          WALIDSITE_QA_ADMIN_ORIGIN: http://127.0.0.1:8000
          WALIDSITE_QA_ADMIN_LOCALE: en
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "${{ github.event.pull_request.head.sha }}"
          export WALIDSITE_QA_ADMIN_PASSWORD="$(python3 - <<'PY'
          import secrets
          print('Visual-' + secrets.token_urlsafe(24) + '-A9!')
          PY
          )"

          cd backend
          rm -f storage/app/site-installed.lock
          php artisan migrate:fresh --force
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          config([
              "site.setup_enabled" => true,
              "site.setup_token" => str_repeat("v", 40),
              "site.setup_database_ready" => false,
              "site.install_lock_path" => storage_path("app/site-installed.lock"),
          ]);
          $installer = app(App\Support\Deployment\SiteInstaller::class);
          $ok = $installer->complete(
              getenv("WALIDSITE_QA_ADMIN_PASSWORD"),
              app(App\Support\Deployment\SiteUpdater::class)
          );
          if (! $ok) { fwrite(STDERR, "Visual QA owner activation was not completed\\n"); exit(2); }
          file_put_contents("/tmp/walidsite-admin-email", $installer->ownerEmail());
          $provider = App\Models\AiProvider::create([
              "display_name" => "Visual QA provider",
              "provider_type" => "ollama-compatible",
              "base_url" => "http://127.0.0.1:11434",
              "secret_ciphertext" => null,
              "enabled" => false,
              "health_status" => "unverified",
              "routing_priority" => 90,
              "concurrent_limit" => 1,
              "timeout_seconds" => 5,
              "daily_budget_minor" => 500,
              "currency" => "USD",
          ]);
          file_put_contents("/tmp/walidsite-admin-provider-id", (string) $provider->id);
          '
          cd ..

          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium

          cd backend
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/walidsite-admin-visual.log 2>&1 &
          server_pid=$!
          cd ..
          session_dir=""
          plan_dir=""
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            if test -n "$session_dir"; then rm -rf -- "$session_dir"; fi
            if test -n "$plan_dir"; then rm -rf -- "$plan_dir"; fi
            unset WALIDSITE_QA_ADMIN_PASSWORD WALIDSITE_QA_ADMIN_EMAIL WALIDSITE_CAPTURE_STORAGE_STATE
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/admin/login >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/walidsite-admin-visual.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/admin/login >/dev/null

          export WALIDSITE_QA_ADMIN_EMAIL="$(cat /tmp/walidsite-admin-email)"
          if ! session_output="$(python3 qa/admin_visual_session.py)"; then
            echo "Admin session helper rejected the local runtime; server diagnostics follow"
            cat /tmp/walidsite-admin-visual.log
            exit 1
          fi
          unset WALIDSITE_QA_ADMIN_EMAIL
          export WALIDSITE_CAPTURE_STORAGE_STATE="$(printf '%s\n' "$session_output" | sed -n 's/^WALIDSITE_CAPTURE_STORAGE_STATE=//p')"
          test -n "$WALIDSITE_CAPTURE_STORAGE_STATE"
          session_dir="$(dirname "$WALIDSITE_CAPTURE_STORAGE_STATE")"
          provider_id="$(cat /tmp/walidsite-admin-provider-id)"
          plan_dir="$(mktemp -d /tmp/walidsite-admin-plan.XXXXXX)"
          plan_path="$plan_dir/admin-plan.json"
          python3 qa/build_admin_visual_plan.py --provider-id "$provider_id" --locale en --dpr 1 --timeout 120 --output "$plan_path"

          # Earlier mandatory test/install steps legitimately generate only these
          # untracked build caches. Remove exact generated paths; never reset or
          # clean arbitrary source before provenance attestation.
          git clean -fd -- backend/composer.lock qa/__pycache__ qa/tests/__pycache__
          export PYTHONDONTWRITEBYTECODE=1
          dirty_status="$(git status --porcelain=v1 --untracked-files=all)"
          if test -n "$dirty_status"; then
            echo "Visual attestation found repository changes before capture (status/path only):"
            printf '%s\n' "$dirty_status"
            exit 3
          fi

          set +e
          python3 qa/visual_diagnostics.py --plan "$plan_path" --commit "$tested_sha"
          diagnostic_exit=$?
          set -e
          if test "$diagnostic_exit" -gt 1; then
            echo "Admin visual diagnostics failed before producing comparable runtime pixels"
            exit "$diagnostic_exit"
          fi

          REPORT_PATH="qa/visual-diagnostics/$tested_sha/report.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['REPORT_PATH']).read_text(encoding='utf-8'))
          screens = report.get('screens', {})
          expected = {f'ADMIN-{index:02d}' for index in range(1, 14)}
          if set(screens) != expected:
              raise SystemExit('Admin diagnostics did not cover exactly ADMIN-01..13')
          allowed = {'mismatch', 'exact_pixels_unattested'}
          invalid = {sid: row.get('status') for sid, row in screens.items() if row.get('status') not in allowed}
          if invalid:
              raise SystemExit('Admin renderer/runtime failure: ' + json.dumps(invalid, sort_keys=True))
          mismatches = {sid: row.get('mismatching_rgba_pixels', 0) for sid, row in screens.items()}
          print('REAL ADMIN RUNTIME CAPTURES VERIFIED: 13/13 renderer/auth/route/PNG checks passed')
          print('ZERO-RGBA MATCHES: ' + str(sum(value == 0 for value in mismatches.values())) + '/13')
          print('MISMATCH COUNTS: ' + json.dumps(mismatches, sort_keys=True))
          PY

          # Read-only Admin AR/EN desktop/mobile accessibility diagnostics.
          # Defects stay recorded; pixel parity is never inferred from CI.
          set +e
          python3 -B qa/audit_admin_runtime.py --provider-id "$provider_id" --commit "$tested_sha" --output "/home/runner/work/WalidSite/WalidSite/qa/visual-diagnostics/$tested_sha/admin-runtime-a11y.json"
          a11y_exit=$?
          set -e
          if test "$a11y_exit" -gt 1; then exit "$a11y_exit"; fi

          # Real Web diagnostics reuse this already-verified local Laravel
          # server. The two dynamic pages require actual published source data;
          # static pages never substitute invented project/article records.
          web_plan_path="$plan_dir/web-plan.json"
          python3 -B qa/build_web_visual_plan.py --locale en --dpr 1 --timeout 120 --output "$web_plan_path"
          set +e
          python3 -B qa/visual_diagnostics.py --plan "$web_plan_path" --commit "$tested_sha" --group web
          web_exit=$?
          set -e
          if test "$web_exit" -gt 1; then
            echo "Web visual diagnostics failed before producing comparable runtime pixels"
            exit "$web_exit"
          fi
          REPORT_PATH="qa/visual-diagnostics/$tested_sha-web/report.json" python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          screens = report.get("screens", {})
          expected = {f"WEB-{i:02d}" for i in range(1, 15)} - {"WEB-05", "WEB-08"}
          if set(screens) != expected:
              raise SystemExit("Web diagnostics must cover exactly 12 routable public Web pages")
          allowed = {"mismatch", "exact_pixels_unattested"}
          invalid = {sid: row.get("status") for sid, row in screens.items()
                     if row.get("status") not in allowed}
          if invalid:
              raise SystemExit("Web renderer/runtime failure: " + json.dumps(invalid, sort_keys=True))
          if any(row.get("runtime_size") != row.get("reference_size") for row in screens.values()):
              raise SystemExit("Web runtime PNG dimensions disagree with immutable references")
          print("REAL WEB RUNTIME CAPTURES VERIFIED: 12/12 currently routable static pages")
          print("WEB ZERO-RGBA MATCHES: " + str(sum(
              row.get("mismatching_rgba_pixels", 0) == 0 for row in screens.values()
          )) + "/12")
          print("WEB-06 AI Engineering: captured on the real Laravel GET route")
          print("DYNAMIC WEB-05/08: pending approved published slugs; not fabricated")
          PY

      - name: Upload Issue 481 Admin runtime visual diagnostics
        if: ${{ always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/481-') }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-481-admin-and-web-runtime-visual-diagnostics
          path: qa/visual-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: T007 real Laravel visual diagnostics
        id: t007_visual_diagnostics
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/T007-runtime-parity-final' }}
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/t007-visual.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
          WALIDSITE_RENDER_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          renderer_sha="$(git rev-parse HEAD)"
          test "$renderer_sha" = "${{ github.event.pull_request.head.sha }}"
          export GITHUB_SHA="$renderer_sha"
          touch backend/database/t007-visual.sqlite
          cd backend
          php artisan migrate:fresh --force
          php artisan db:seed --class=T007VisualCaptureSeeder --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/walidsite-t007.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd ..
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/walidsite-t007.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
          python qa/capture_t007_diagnostics.py --commit "$(git rev-parse HEAD)" --locale en --dpr 1

      - name: Upload T007 runtime visual diagnostics
        if: ${{ always() && steps.t007_visual_diagnostics.outcome != 'skipped' && github.event_name == 'pull_request' && github.head_ref == 'feat/T007-runtime-parity-final' }}
        uses: actions/upload-artifact@v4
        with:
          name: T007-runtime-visual-diagnostics
          path: qa/visual-diagnostics/T007
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('backend/package.json') != '' }}
        with:
          node-version: '22'
      - name: Web build and tests (mandatory once scaffold exists)
        if: ${{ hashFiles('backend/package.json') != '' }}
        shell: bash
        run: |
          cd backend
          npm ci
          npm run lint
          npm run test -- --run
          npm run build
      - uses: subosito/flutter-action@v2
        if: ${{ hashFiles('mobile/pubspec.yaml') != '' }}
        with:
          channel: stable
      - name: Flutter analyze and tests (mandatory once scaffold exists)
        if: ${{ hashFiles('mobile/pubspec.yaml') != '' }}
        shell: bash
        run: |
          cd mobile
          flutter pub get
          flutter analyze
          flutter test

  build-cpanel-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_mysql, zip
      - name: Prepare production dependencies
        run: |
          cd backend
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Package trusted checked-in code for cPanel
        run: |
          python3 qa/build_cpanel_package.py --source . --output dist/WalidSite-cPanel.zip --sha "$GITHUB_SHA"
          unzip -t dist/WalidSite-cPanel.zip
          (cd dist && sha256sum --check WalidSite-cPanel.zip.sha256)
          python3 -c 'from pathlib import Path; from qa.build_cpanel_package import verify_archive; import os; verify_archive(Path("dist/WalidSite-cPanel.zip"), os.environ["GITHUB_SHA"])'
      - uses: actions/upload-artifact@v4
        with:
          name: WalidSite-cPanel-installer
          path: dist/WalidSite-cPanel.zip*
          if-no-files-found: error
          retention-days: 30

  cleanup-merged-branch:
    # Runs only after an actual merge and only for a branch in this repository.
    # No checkout or execution of PR-provided code; never deletes a reused branch.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Safely remove merged short-lived branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$SOURCE_BRANCH" in
            feat/*|fix/*|chore/*) ;;
            *) echo "Preserving non-task branch: $SOURCE_BRANCH"; exit 0 ;;
          esac
          if [ "$SOURCE_BRANCH" = main ]; then exit 0; fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha' 2>/dev/null)" || {
            echo "Already deleted (or cannot read branch); no destructive action"
            exit 0
          }
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo "Branch has advanced since merge; preserve and investigate"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SOURCE_BRANCH}"
          echo "Deleted merged short-lived branch $SOURCE_BRANCH"

      - name: Reconcile pre-hook T001 branches after a verified merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # These two PRs merged before the guarded auto-cleanup job existed.
          # Keep this idempotent: absence or any ref movement means no deletion.
          while read -r pr_number branch expected_sha; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            merged="$(jq -r '.merged' <<<"${pr_json}")"
            pr_head="$(jq -r '.head.ref' <<<"${pr_json}")"
            pr_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            pr_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
            pr_base="$(jq -r '.base.ref' <<<"${pr_json}")"
            if [[ "${merged}" != true || "${pr_head}" != "${branch}" ||
                  "${pr_sha}" != "${expected_sha}" ||
                  "${pr_repo}" != "${GITHUB_REPOSITORY}" || "${pr_base}" != main ]]; then
              echo "Preserving ${branch}: PR provenance/merge does not match"
              continue
            fi

            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null)" || {
              echo "Already absent or unreadable: ${branch}; no deletion attempted"
              continue
            }
            if [[ "${current}" != "${expected_sha}" ]]; then
              echo "Preserving ${branch}: branch has advanced beyond merged PR"
              continue
            fi

            open_count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${GITHUB_REPOSITORY%%/*}:${branch}" --jq 'length')"
            if [[ "${open_count}" != 0 ]]; then
              echo "Preserving ${branch}: active PR found"
              continue
            fi

            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted verified merged legacy branch ${branch}"
          done <<'MERGED_PRE_HOOK'
          29 feat/T001-governance-and-ci c89c0a080515cb846e0a408e7ecb27c6d15de26f
          30 feat/T001-runtime-scaffold 1803e74a477217597eee93a6d9f210f775b66deb
          MERGED_PRE_HOOK

      # Execute only from trusted merged main, never from PR-provided code.
      # This one-time reconciliation has a pinned six-branch allowlist.
      - name: Checkout trusted main for abandoned duplicate reconciliation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prune verified abandoned duplicate branches only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 qa/cleanup_abandoned_duplicate_branches.py
