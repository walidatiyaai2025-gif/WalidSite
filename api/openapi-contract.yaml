    get:
      operationId: adminShowDiagnosisTaskRoute
      summary: Persisted diagnosis primary/fallback, budgets and observed admission readiness
      tags: [admin]
      x-required-role: admin
      security:
      - bearerAuth: []
      responses:
        '200': {description: Saved settings and current recorded-state eligibility; no live provider request or spend promise}
        '401': {description: Unauthenticated}
        '403': {description: Forbidden}
        '429': {description: Throttled}
    put:
      operationId: adminSaveDiagnosisTaskRoute
      summary: Safely configure real mobile diagnosis model route and quotas
      tags: [admin]
      x-required-role: admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [primary_model_id, currency, reservation_minor, per_minute, per_day]
              properties:
                primary_model_id: {type: string, format: uuid}
                fallback_model_ids:
                  type: array
                  maxItems: 8
                  uniqueItems: true
                  items: {type: string, format: uuid}
                currency: {type: string, enum: [USD, KWD, EUR]}
                reservation_minor: {type: integer, minimum: 0, maximum: 100000000}
                per_minute: {type: integer, minimum: 1, maximum: 60}
                per_day: {type: integer, minimum: 1, maximum: 10000}
      responses:
        '200': {description: Stored policy; paid models require matching currency and positive reservation}
        '401': {description: Unauthenticated}
        '403': {description: Forbidden}
        '422': {description: Invalid model, currency, limit or unsupported input}
